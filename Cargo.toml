[package]
name = "rust-core-service"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework
axum = "0.8.9"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database & ORM
diesel = { version = "2.3.10", features = ["postgres", "uuid", "chrono", "r2d2"] }
dotenvy = "0.15"

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth & Security
jsonwebtoken = "9.3"
argon2 = "0.5" # For hashing passwords

# Utils & Types
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# API Documentation (Swagger/Scalar)
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

diesel-derive-enum = { version = "2.1", features = ["postgres"] }
validator = { version = "0.20.0", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
tower = { version = "0.5.3", features = ["util"] }
log = "0.4.32"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3     # [Most important] Set back to 3 to squeeze out maximum performance
strip = true      # Strip debug symbols (drastically reduces file size without affecting speed)
lto = true        # Link-Time Optimization (reduces file size and makes the code run "faster")
codegen-units = 1 # Allow the build to be slower so the compiler can see all the code and optimize best